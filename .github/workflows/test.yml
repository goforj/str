name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify module files
        run: |
          go mod tidy
          go -C docs mod tidy
          go -C examples mod tidy
          git diff --exit-code -- go.mod go.sum docs/go.mod docs/go.sum examples/go.mod examples/go.sum

      - name: Run vet
        run: |
          go vet ./...
          go -C docs vet ./...
          go -C examples vet ./...

      - name: Run tests with race detection and coverage
        run: |
          go test -race -coverprofile=coverage.txt .
          go -C docs test -race ./...
          go -C examples test ./...

      - name: Verify generated README sections
        run: |
          go -C docs run ./readme
          git diff --exit-code -- README.md docs/readme/benchmarks.txt

      - name: Require full library coverage
        run: test "$(go tool cover -func=coverage.txt | awk '/^total:/ {print $3}')" = "100.0%"

      - name: Upload results to Codecov
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
