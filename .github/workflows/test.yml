name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.0", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify module files
        run: |
          go mod tidy
          go -C docs mod tidy
          go -C examples mod tidy
          git diff --exit-code -- go.mod go.sum docs/go.mod docs/go.sum examples/go.mod examples/go.sum

      - name: Run vet
        run: |
          go vet ./...
          go -C docs vet ./...
          go -C examples vet ./...

      - name: Run tests with race detection and coverage
        run: |
          go test -race -coverprofile=coverage.txt .
          go -C docs test -race ./...
          go -C examples test ./...

      - name: Verify generated README sections
        run: |
          go -C docs run ./readme
          git diff --exit-code -- README.md docs/readme/benchmarks.txt

      - name: Require full library coverage
        run: test "$(go tool cover -func=coverage.txt | awk '/^total:/ {print $3}')" = "100.0%"

      - name: Upload results to Codecov
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
